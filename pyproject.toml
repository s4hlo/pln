[project]
name = "pln"
version = "0.1.0"
description = ""
authors = [
    {name = "S4hlo",email = "rfl.magno02@gmail.com"}
]
readme = "README.md"
requires-python = "3.10.12"
dependencies = [
    "notebook (>=7.4.1,<8.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "numpy (>=2.2.5,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "nltk (>=3.9.1,<4.0.0)",
    "spacy (>=3.8.5,<4.0.0)",
    "fasttext (>=0.9.3,<0.10.0)",
    "umap (>=0.1.1,<0.2.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "umap-learn (>=0.5.7,<0.6.0)"
]

[tool.poetry]
packages = [{include = "pln", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
